    return card(232, 92, 400, 300, '<div class="kl">Fill rate con el plan' + (una ? ' <span class="mu">· ' + una.nombre + '</span>' : '') + '</div><div class="hl1" style="margin:2px 0 4px">' + (esp >= META ? 'Lo esperado alcanza la meta' : 'Lo esperado queda a ' + n(META - esp, 2) + ' pts de la meta') + '</div>' + svg(W, H, s, 'De ' + n(hoy, 2) + ' % a entre ' + n(esp, 2) + ' % y ' + n(fin, 2) + ' %'))
      + card(648, 92, 608, 300, '<div class="kl">Acciones</div><div class="hl1" style="margin:2px 0 2px">«' + mayor.accion + '» es la que más devuelve</div><table class="pt"><tr><th></th><th>Acción</th><th>Dueño</th><th>Fecha</th><th style="overflow:visible">Unidades por trimestre</th><th></th></tr>' + filas + '</table>')
      + card(232, 408, 400, 288, '<div class="kl">Por cadena <span class="mu">· ○ hoy · <span style="color:' + AZ + '">▬</span> con el plan</span></div><div class="hl1" style="margin:2px 0 6px">' + (una ? una.nombre + (una.lo >= P.promesa ? ' llega' : ' no llega') + ' a la promesa' : llegan + ' de ' + P.cadenas.length + ' cadenas llegan a la promesa') + '</div>' + svg(364, hC + 6, r, 'Promesa de ' + n(P.promesa, 1) + ' % por cadena'))
      + card(648, 408, 608, 288, '<div class="kl">SKU y centro <span class="mu">· unidades perdidas de más' + (una ? ' · todas las cadenas' : '') + '</span></div><div class="hl1" style="margin:2px 0 8px">' + cds[top] + ' de los ' + P.sku.length + ' primeros son de ' + top + '</div><div class="sks">' + sk + '</div>');
  }

  const PAG = [['¿Estamos cumpliendo con las cadenas?', p1], ['¿Dónde se pierde?', p2], ['¿Qué arreglamos?', p3]];
  function respuesta(c) {                                           // la respuesta bajo la pregunta: veredicto, motivo y rango aplicado (R62). Las cifras van en las tarjetas
    const rango = (E.n ? 'las ' + c.len + ' semanas' : 'la historia') + ' al ' + fl(mas(c.w1, 6)), P = D.plan;
    if (E.pag === 0) {
      const ver = c.fr >= META ? ['v', 'Sí'] : (c.fr >= META - 1 ? ['a', 'Casi'] : ['r', 'No']);
      const m = c.fr >= META ? 'Sobre la meta' : (c.fr >= META - 1 ? 'A ' + n(META - c.fr, 2) + ' puntos de la meta' : 'Bajo la meta');
      const nr = c.racha != null ? ' y bajo lo normal desde el ' + fc(fecha(c.racha)) : (c.ult.length ? ', con ' + c.ult.length + (c.ult.length === 1 ? ' semana' : ' semanas') + ' bajo lo normal' : ' y dentro de lo normal');
      return '<span class="chip ' + ver[0] + '">' + ver[1] + '</span>' + m + nr + ', en ' + rango + '.';
    }
    if (E.pag === 1) return !c.tc ? '<span class="chip g">Sin comparación</span>Lo que se pierde en cada cruce, en ' + rango + '.' : c.focos.length ? '<span class="chip r">' + c.focos.length + (c.focos.length === 1 ? ' foco' : ' focos') + '</span>' + lista(c.focos.map(s => '<b>' + s.lugar + '</b> (' + s.mot[2].toLowerCase() + ')')) + ', en ' + rango + '.' : '<span class="chip v">Sin focos</span>Ningún cruce resta medio punto o más en ' + rango + '.';
    if (c.w1 < D.episodio[0]) return '<span class="chip g">—</span>Sin plan abierto.';
    const una = E.ca >= 0 ? P.cadenas.find(x => x.k === E.ca) : null;
    if (una) { const si = una.lo >= P.promesa, rz = P.acciones.find(a => a.ca === una.k); return '<span class="chip ' + (si ? 'v' : 'r') + '">' + una.nombre + '</span>' + (si ? 'Llega a la promesa con el plan' : 'No llega a la promesa con el plan: le faltan ' + n(P.promesa - una.lo, 2) + ' puntos') + (una.sin < una.comp && rz ? '; sin la acción de ' + MOT[rz.mot][2].toLowerCase() + ', queda en ' + n(una.sin, 1) + ' %' : '') + '.'; }
    return '<span class="chip v">+' + n(P.acciones.reduce((a, x) => a + x.u, 0)) + ' unidades</span>por trimestre con ' + P.acciones.length + ' acciones; la primera vence el ' + P.primera + '.';
  }
  function render() {
    let c = calcular();
    if (!c.t[0]) { E.ca = -1; c = calcular(); }
    const cont = $('cont'), act = document.activeElement, clave = act && act.dataset && cont.contains(act) ? Object.keys(act.dataset)[0] : null, valor = clave ? act.dataset[clave] : null;
    document.documentElement.dataset.tema = E.tema;
    $('tit').textContent = PAG[E.pag][0];
    $('resp').innerHTML = respuesta(c);
    cont.innerHTML = PAG[E.pag][1](c);
    const marca = (sel, on) => document.querySelectorAll(sel).forEach(b => { const si = on(b); b.classList.toggle('on', si); b.setAttribute('aria-pressed', si); });
    marca('[data-pag]', b => +b.dataset.pag === E.pag); marca('[data-n]', b => +b.dataset.n === E.n); marca('[data-tema]', b => b.dataset.tema === E.tema);
    $('bdg').style.display = c.focos.length ? 'block' : 'none'; $('bdg').textContent = c.focos.length;
    $('f-ca').textContent = (E.ca < 0 ? 'Todas las cadenas' : D.cad[E.ca][1]) + ' ▾';
    $('f-fecha').textContent = fl(mas(c.w1, 6));
    const plan = E.pag === 2;                                       // el plan es del episodio abierto: lo mueve la cadena, no la ventana ni la fecha
    document.querySelectorAll('#filtros .solo').forEach(x => { x.style.display = plan ? 'none' : 'flex'; });
    $('ctx').style.display = plan ? 'block' : 'none';
    $('ctx').textContent = 'Episodio del ' + fl(fecha(D.episodio[0])) + ' al ' + fl(mas(D.episodio[1], 6));
    $('ayuda').hidden = !E.ayuda; $('como').setAttribute('aria-expanded', E.ayuda);
    if (E.ayuda) $('ayuda').innerHTML = '<b>Cómo leer</b><div><i class="r"></i>Rojo: lo que está mal hoy</div><div><i class="p"></i>Azul: el dato</div><div><i class="b"></i>Banda: rango normal, ' + n(c.lim.piso, 1) + ' a ' + n(c.lim.techo, 1) + ' %</div>'
      + '<div><i class="m"></i>Meta: ' + META + ' %</div><div><i class="o"></i>antes<i class="p" style="margin-left:8px"></i>ahora</div><div>◀ ▶ o las flechas mueven la fecha</div>';
    if (clave) { const el = cont.querySelector('[data-' + clave + '="' + valor + '"]'); if (el) el.focus(); }
    window.T.ultimo = c;
  }
  let reloj = 0;
  function mueve(k) { const b = document.body; b.classList.remove('mv-pag', 'mv-vis'); void b.offsetWidth; b.classList.add('mv-' + k); clearTimeout(reloj); reloj = setTimeout(() => b.classList.remove('mv-pag', 'mv-vis'), 340); }
  function mover(w) { E.fin = Math.max(D.comparable + 3, Math.min(NS - 1, w)); render(); }
  window.T = {
    set(o) {                                                         // T.set({pag:1, fin:'2026-07-27', n:13, ca:'CAN', foco:'ca:1:2', tema:'oscuro'})
      if (o.pag != null) E.pag = o.pag;

    },

      const pinta = e => { const s = getComputedStyle(e); return [s.color, s.fill, s.stroke, s.backgroundColor]; }, hex = h => { const m = h.match(/^#(..)(..)(..)$/); return m ? 'rgb(' + parseInt(m[1], 16) + ', ' + parseInt(m[2], 16) + ', ' + parseInt(m[3], 16) + ')' : h; };
      const rojos = Array.from(document.querySelectorAll('#cont *, #resp *')).filter(e => !e.children.length || e.tagName === 'text').filter(e => pinta(e).some(x => x === hex(rojo) || x === hex(rtx))).length;
      return { al: fl(mas(c.w1, 6)), semanas: c.len, fr: n(c.fr, 2), comp: c.frc == null ? null : n(c.frc, 2), veredicto: $('resp').querySelector('.chip').textContent, titular: (document.querySelector('#cont .hl1') || {}).textContent || '',
        titulares: Array.from(document.querySelectorAll('#cont .hl1')).map(x => x.textContent), piso: n(c.lim.piso, 2), perdidas: n(c.t[0] - c.t[1]), focos: c.focos.map(s => s.lugar + ' · ' + s.mot[2] + ' · −' + n(s.pts, 2)), alertas: c.focos.map(s => s.lugar),
        respuesta: $('resp').textContent, palabras: tx.split(/\s+/).filter(x => /[a-záéíóúñ]{3,}/i.test(x)).length, numeros: (tx.match(/\d[\d.,]*/g) || []).length, rojos, tema: E.tema };
    }
  };
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-pag],[data-vista],[data-corte],[data-mov],[data-n],[data-ca],[data-foco],[data-tema],#f-cadena,#como'), menu = $('m-ca');
    if (!b || b.id !== 'f-cadena') menu.style.display = 'none';
    if (!b) return;

    if (b.id === 'f-cadena') { menu.style.left = (b.getBoundingClientRect().left - document.body.getBoundingClientRect().left) + 'px'; menu.style.display = menu.style.display === 'block' ? 'none' : 'block'; return; }
    if (ds.mov) { mover(E.fin + (+ds.mov)); return; }
    if (ds.pag != null) { E.pag = +ds.pag; mueve('pag'); }
    else if (ds.vista != null) { E.vista = +ds.vista; mueve('vis'); }
    else if (ds.corte != null) { E.corte = +ds.corte; mueve('vis'); }
    else if (ds.foco != null) { E.foco = ds.foco; mueve('vis'); }
    else if (ds.n != null) E.n = +ds.n;

    else if (b.id === 'como') E.ayuda = !E.ayuda;

  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') mover(E.fin - 1);
